version: "3.9"

# ─── RestaurantQR — Full Stack ────────────────────────────────────────────────
# Khởi động: docker-compose up -d
# Dừng:      docker-compose down
# Reset DB:  docker-compose down -v

services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: restaurantqr-postgres
    environment:
      POSTGRES_USER: "${PG_USER:-admin}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:-StrongPass123!}"
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-postgres.sh:/docker-entrypoint-initdb.d/init-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-admin} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - restaurantqr-net

  # ─── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: restaurantqr-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER:-admin}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD:-StrongPass123!}"
      MONGO_INITDB_DATABASE: ReservationDb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - restaurantqr-net

  # ─── Identity.API ────────────────────────────────────────────────────────────
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity.API/Dockerfile
    container_name: restaurantqr-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:3001
      ConnectionStrings__IdentityDb: "Host=postgres;Database=IdentityDb;Username=${PG_USER:-admin};Password=${PG_PASSWORD:-StrongPass123!}"
      Jwt__Issuer: RestaurantQR
      Jwt__Audience: RestaurantQR
      Jwt__AccessTokenSecret: "${JWT_ACCESS_SECRET}"
      Jwt__RefreshTokenSecret: "${JWT_REFRESH_SECRET}"
      Jwt__AccessTokenExpiresInMinutes: "15"
      Jwt__RefreshTokenExpiresInDays: "7"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurantqr-net
    restart: unless-stopped

  # ─── Menu.API ────────────────────────────────────────────────────────────────
  menu-api:
    build:
      context: .
      dockerfile: src/Services/Menu.API/Dockerfile
    container_name: restaurantqr-menu
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:3002
      ConnectionStrings__MenuDb: "Host=postgres;Database=MenuDb;Username=${PG_USER:-admin};Password=${PG_PASSWORD:-StrongPass123!}"
      Jwt__Issuer: RestaurantQR
      Jwt__Audience: RestaurantQR
      Jwt__AccessTokenSecret: "${JWT_ACCESS_SECRET}"
    ports:
      - "3002:3002"
    volumes:
      - menu_images:/app/wwwroot/images
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - restaurantqr-net
    restart: unless-stopped

  # ─── Order.API ───────────────────────────────────────────────────────────────
  order-api:
    build:
      context: .
      dockerfile: src/Services/Order.API/Dockerfile
    container_name: restaurantqr-order
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5219
      ConnectionStrings__OrderDb: "Host=postgres;Database=OrderDb;Username=${PG_USER:-admin};Password=${PG_PASSWORD:-StrongPass123!}"
      Jwt__Issuer: RestaurantQR
      Jwt__Audience: RestaurantQR
      Jwt__AccessTokenSecret: "${JWT_ACCESS_SECRET}"
      GuestJwt__Issuer: RestaurantQR
      GuestJwt__Audience: RestaurantQR
      GuestJwt__AccessTokenSecret: "${GUEST_JWT_ACCESS_SECRET}"
      GuestJwt__RefreshTokenSecret: "${GUEST_JWT_REFRESH_SECRET}"
      GuestJwt__AccessTokenExpiresInMinutes: "60"
      GuestJwt__RefreshTokenExpiresInDays: "1"
      MenuApi__BaseUrl: "http://menu-api:3002"
      AllowedOrigins__0: "${FRONTEND_URL:-http://localhost:4000}"
      AllowedOrigins__1: "${GATEWAY_URL:-http://localhost:5000}"
    ports:
      - "5219:5219"
    depends_on:
      postgres:
        condition: service_healthy
      menu-api:
        condition: service_started
    networks:
      - restaurantqr-net
    restart: unless-stopped

  # ─── Reservation.API ─────────────────────────────────────────────────────────
  reservation-api:
    build:
      context: .
      dockerfile: src/Services/Reservation.API/Dockerfile
    container_name: restaurantqr-reservation
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:3004
      MongoDb__ConnectionString: "mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-StrongPass123!}@mongodb:27017"
      MongoDb__DatabaseName: ReservationDb
      Jwt__Issuer: RestaurantQR
      Jwt__Audience: RestaurantQR
      Jwt__AccessTokenSecret: "${JWT_ACCESS_SECRET}"
    ports:
      - "3004:3004"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - restaurantqr-net
    restart: unless-stopped

  # ─── Gateway.API (YARP) ──────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Gateway.API/Dockerfile
    container_name: restaurantqr-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      AllowedOrigins__0: "${FRONTEND_URL:-http://localhost:4000}"
    ports:
      - "5000:5000"
    depends_on:
      - identity-api
      - menu-api
      - order-api
      - reservation-api
    networks:
      - restaurantqr-net
    restart: unless-stopped

  # ─── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_URL: "${FRONTEND_URL:-http://localhost:4000}"
        NEXT_PUBLIC_API_IDENTITY: "${GATEWAY_URL:-http://localhost:5000}/api/v1"
        NEXT_PUBLIC_API_MENU: "${GATEWAY_URL:-http://localhost:5000}/api/v1"
        NEXT_PUBLIC_API_ORDER: "${GATEWAY_URL:-http://localhost:5000}/api/v1"
        NEXT_PUBLIC_API_RESERVATION: "${GATEWAY_URL:-http://localhost:5000}/api/v1"
        NEXT_PUBLIC_SIGNALR_ORDER: "${GATEWAY_URL:-http://localhost:5000}"
    container_name: restaurantqr-frontend
    ports:
      - "4000:4000"
    depends_on:
      - gateway
    networks:
      - restaurantqr-net
    restart: unless-stopped

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  mongodb_data:
  menu_images:

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  restaurantqr-net:
    driver: bridge